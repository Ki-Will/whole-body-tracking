[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whole-body-tracking"
version = "0.1.0"
description = "CPU-first person tracking and face-to-body association with explicit uncertainty states"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24,<3",
  "opencv-contrib-python>=4.9,<5",
  "onnxruntime>=1.17,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
whole-body-tracking = "whole_body_tracking.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
